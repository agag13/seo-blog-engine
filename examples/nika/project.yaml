# Worked example: what a per-site config looks like once it is real.
# The client's own repo holds the live copy of this; the engine only reads it.

site:
  name: "Nika"
  url: "https://nika.finance"
  locale: "en-US"
  root_slugs: false

cms:
  type: "markdown"          # a code-based site: Next.js/Astro. See cms-publish.
  default_status: "draft"
  output_dir: "content-briefs"

voice:
  fingerprint: "config/voice-fingerprint.yaml"
  profile_inhouse: "nika-article"
  profile_guest: "nika-daniel-essay"

context:
  partners: "PARTNERS.md"
  facts: "FACTS.md"

seo:
  gsc_property: "https://nika.finance/"
  primary_market: "United States"
  # Markets the client may not address. serp_gate and the intake both read this.
  excluded_markets: ["India"]

gates:
  factcheck_required_for: ["legal", "financial", "regulatory"]
  serp_gate: required
  voice_gate: required
  facts_gate: required
